services:
  - type: web
    name: colina-real-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: ohio
    healthCheckPath: /api/products
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: colina-real-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://colina-real.netlify.app,http://localhost:4200

databases:
  - name: colina-real-db
    plan: free
    region: ohio
    databaseName: colina_real
    user: colina_real_user
