name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Trigger Render deploy via webhook
        run: |
          curl -s -o response.json -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            > http_status.txt
          STATUS=$(cat http_status.txt)
          echo "Render webhook responded with HTTP $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Deploy hook failed with status $STATUS"
            cat response.json
            exit 1
          fi

      - name: Notify backend deploy status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Backend deploy triggered successfully on Render."
          else
            echo "Backend deploy FAILED. Check Render dashboard for details."
          fi

  deploy-frontend:
    name: Deploy Frontend to Netlify
    runs-on: ubuntu-latest
    needs: []
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build -- --configuration production

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        run: |
          netlify deploy \
            --prod \
            --dir=dist/frontend/browser \
            --auth=${{ secrets.NETLIFY_AUTH_TOKEN }} \
            --site=${{ secrets.NETLIFY_SITE_ID }}

      - name: Notify frontend deploy status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Frontend deployed successfully to Netlify."
          else
            echo "Frontend deploy FAILED. Check Netlify dashboard for details."
          fi
